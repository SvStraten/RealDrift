# Emergency is a PRIVATE orthopedic emergency log and is not part of this repository.
# To reproduce it you need the original log. Column names below are the ones used in the paper
# experiments and may need adjusting to your export.
dataset: emergency
n_clusters: 4                       # K used for the paper
t0: auto

raw_log: data/raw/emergency_ORT.csv # not distributed
columns:
  case: Case ID
  activity: Activity
  timestamp: time:timestamp
  resource: Resource
  lifecycle: lifecycle:transition

sublogs_dir: data/sublogs
concept_pools_dir: data/concept_pools

calendars_cache: data/calendars/emergency_calendars.pkl
calendar_params:
  granule_minutes: 60
  d_supp: 0.99
  d_conf: 0.1
  d_part: 0.4

use_atkde: true
atkde_strict: false

clustering:
  seed: 42
  target_variance: 0.80
  keep_lifecycle: all
  case_attributes:
    - {source: Age, name: age, transform: none}
    - {source: Gender, name: gender, transform: category}

unconstrained_resources: [UNKNOWN]   # placeholder for events without a resource, exempt from calendars and capacity

composer:
  gradual_window: 30
  horizon_days: 21
  max_preempt_evictions: 5
  sa_iterations: 3000
  resource_cap: 1
  max_beds: null

# Detector settings for evaluation/run_detection.py. The detectors themselves are added later as
# modules that register themselves (see evaluation/detectors.py), then listed here.
detectors:
  pelt:                                   # Adams et al., PELT on feature series (evaluation/detector_pelt.py)
    module: evaluation.detector_pelt
    params: {window_days: 7, penalty: 0.1, min_features: 1, merge_windows: 1}
    grid:                                 # searched on the tuning seeds, selected by mean F1
      penalty: [0.1, 0.2, 0.5, 1.0, 2.0]
      min_features: [1, 3, 5, 8]
      merge_windows: [1, 2, 4]
    per_dataset_grid:                     # the small logs have too few cases per 7-day window
      sepsis: {window_days: [14, 30]}
      emergency: {window_days: [14, 30]}
  vc:                                     # Version Clustering (evaluation/detector_vc.py)
    module: evaluation.detector_vc
    params: {n_windows: 75, min_cluster_size: 5, pen: 1.0}
    grid:
      n_windows: [50, 75, 100]
      min_cluster_size: [3, 5, 10]
      pen: [0.5, 1.0, 1.5]
    per_dataset:                          # Sepsis has only 782 traces, so 75 windows would hold about 10 traces each
      sepsis: {n_windows: 25, min_cluster_size: 3}
    per_dataset_grid:                     # replaces entries of the grid for this dataset
      sepsis: {n_windows: [10, 15, 25], min_cluster_size: [2, 3, 5]}

# The first entry is the main tolerance (also used for tuning), the others are a sensitivity analysis.
# span_fraction is a share of the time span of the stream, so that logs with very different time
# scales (BPIC2012 spans about 1.5 years, Sepsis and Emergency several years) get a comparable tolerance.
tolerances:
  - {name: span2, unit: span_fraction, value: 0.02}
  - {name: d14, unit: days, value: 14}
  - {name: w1, unit: windows, value: 1}         # one analysis window of the detector
  - {name: w05, unit: windows, value: 0.5}
  - {name: w2, unit: windows, value: 2}

errors_count_as_failure: true     # a crashed or skipped run scores 0 instead of being dropped
